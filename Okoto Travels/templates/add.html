<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin | Add New Package</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white">
                        <h4 class="mb-0">Add Travel Package</h4>
                    </div>
                    <div class="card-body">
                        <form action="{{ url_for('add_package') }}" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Destination</label>
                                <input type="text" name="destination" class="form-control" placeholder="e.g. Paris, France" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Price (USD)</label>
                                <input type="number" step="0.01" name="price" class="form-control" placeholder="1500" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Image URL</label>
                                <input type="url" name="image_url" class="form-control" placeholder="https://unsplash.com/..." required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <textarea name="description" class="form-control" rows="3" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Publish Package</button>
                        </form>
                        <a href="{{ url_for('home') }}" class="d-block text-center mt-3 text-muted">Back to Homepage</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
